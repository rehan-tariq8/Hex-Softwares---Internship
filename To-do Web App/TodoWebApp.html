<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Task Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <link rel="stylesheet" href="TodoWebApp.css">
</head>

<body>

    <div class="task-container">

        <div class="task-heading">
            <h1>Task Manager</h1>
            <p>Manage your daily work with style</p>
        </div>

        <div class="row g-3">

            <div class="col-md-9">
                <input type="text" id="taskInput" class="task-input" placeholder="Enter your task">
            </div>

            <div class="col-md-3">
                <button class="add-btn" onclick="addTask()">
                    Add Task
                </button>
            </div>

        </div>

        <div class="task-list" id="taskList"></div>

    </div>

    <script src="TodoWebApp.js"></script>

</body>

</html>
